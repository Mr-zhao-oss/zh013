name: Build DualSubiOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main, master]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build archive (no signing)
        run: |
          cd DualSubiOS
          xcodebuild -project project.pbxproj \
            -scheme DualSubiOS \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath build/DualSubiOS.xcarchive \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            archive

      - name: Package IPA (ad-hoc, unsigned)
        run: |
          cd DualSubiOS
          APP=$(find build/DualSubiOS.xcarchive/Products/Applications -name "*.app" -maxdepth 1 | head -1)
          mkdir -p build/Payload
          cp -R "$APP" build/Payload/
          cd build && zip -r -q DualSubiOS.ipa Payload

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: DualSubiOS-unsigned-ipa
          path: DualSubiOS/build/DualSubiOS.ipa
