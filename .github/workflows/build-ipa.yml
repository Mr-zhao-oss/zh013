name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List Xcode
        run: xcodebuild -version

      - name: Install CocoaPods and build Pods
        run: |
          gem install cocoapods --no-document
          pod install --repo-update 2>&1 || true
          # 先用 workspace build 一次, 让 Pods 的 Yams 产物先生成
          xcodebuild build \
            -workspace PhoneClaw.xcworkspace \
            -scheme PhoneClaw \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO 2>&1 || true
          # 找到 Yams modulemap 并复制到 archive 预期路径
          find build/DerivedData -name "Yams.modulemap" 2>/dev/null | head -5
          echo "=== build step done ==="

      - name: Create missing resource placeholders
        run: |
          mkdir -p Models/open_jtalk_dic_utf_8-1.11
          echo "placeholder" > Models/open_jtalk_dic_utf_8-1.11/.keep

      - name: Resolve SwiftPM packages
        run: xcodebuild -resolvePackageDependencies -workspace PhoneClaw.xcworkspace -scheme PhoneClaw 2>&1 || true
        continue-on-error: true

      - name: Archive
        run: |
          # 用同一个 derivedDataPath, 这样 archive 能复用 build 阶段生成的 Yams 产物
          xcodebuild archive \
            -workspace PhoneClaw.xcworkspace \
            -scheme PhoneClaw \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath build/PhoneClaw.xcarchive \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            DEVELOPMENT_TEAM="" \
            ONLY_ACTIVE_ARCH=NO 2>&1 || true

      - name: Package IPA
        if: always()
        run: |
          APP=$(find build -name "PhoneClaw.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            mkdir -p ipa/Payload
            cp -R "$APP" ipa/Payload/
            cd ipa && zip -r PhoneClaw.ipa Payload/
            echo "IPA 打包成功!"
          else
            echo "没找到 .app, 构建可能失败了"
            # 尝试从 build 产物里找
            find build -name "*.app" -type d 2>/dev/null | head -5
            find build -name "*.app" 2>/dev/null | head -5
          fi

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoneClaw-IPA
          path: ipa/PhoneClaw.ipa
          retention-days: 30

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/DerivedData/**/*.log
            build/PhoneClaw.xcarchive
          retention-days: 7
