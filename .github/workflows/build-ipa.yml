name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: List Xcode
        run: xcodebuild -version

      - name: Install CocoaPods
        run: |
          gem install cocoapods --no-document
          pod install --repo-update 2>&1 || true

      - name: Create missing resource placeholders
        run: |
          mkdir -p Models/open_jtalk_dic_utf_8-1.11
          echo "placeholder" > Models/open_jtalk_dic_utf_8-1.11/.keep

      - name: Resolve packages
        run: xcodebuild -resolvePackageDependencies -project PhoneClaw.xcodeproj -scheme PhoneClaw 2>&1 || true
        continue-on-error: true

      - name: Build archive (use workspace if Pods installed)
        run: |
          if [ -f "PhoneClaw.xcworkspace" ]; then
            echo "使用 xcworkspace (CocoaPods 已安装)"
            xcodebuild archive \
              -workspace PhoneClaw.xcworkspace \
              -scheme PhoneClaw \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath build/PhoneClaw.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" 2>&1
          else
            echo "使用 xcodeproj (无 Pods)"
            xcodebuild archive \
              -project PhoneClaw.xcodeproj \
              -scheme PhoneClaw \
              -configuration Release \
              -destination "generic/platform=iOS" \
              -archivePath build/PhoneClaw.xcarchive \
              CODE_SIGNING_ALLOWED=NO \
              CODE_SIGNING_REQUIRED=NO \
              CODE_SIGN_IDENTITY="" \
              DEVELOPMENT_TEAM="" 2>&1
          fi

      - name: Package IPA
        if: always()
        run: |
          APP=$(find build -name "PhoneClaw.app" -type d 2>/dev/null | head -1)
          if [ -n "$APP" ]; then
            mkdir -p ipa/Payload
            cp -R "$APP" ipa/Payload/
            cd ipa && zip -r PhoneClaw.ipa Payload/
            echo "IPA 打包成功"
          else
            echo "没找到 .app，构建可能失败了"
            exit 1
          fi

      - name: Upload IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: PhoneClaw-IPA
          path: ipa/PhoneClaw.ipa
          retention-days: 30
